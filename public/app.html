<!DOCTYPE html>
<!--
  app.html - Main page after login:
  dashboard with statistics, form to create tasks and the task list.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tasks - Task Management System</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Task Management System</span>
    <div class="user">
      <span id="user-name"></span>
      <button id="logout-btn" type="button" class="btn">Log out</button>
    </div>
  </header>

  <main class="container">
    <!-- Dashboard: numbers filled in by app.js -->
    <section class="dashboard" aria-label="Dashboard">
      <div class="progress">
        <div id="progress-ring" class="ring"><span id="stat-percent">0%</span></div>
        <span class="muted">completed</span>
      </div>
      <div class="stat"><strong id="stat-total">0</strong><span>Total</span></div>
      <div class="stat"><strong id="stat-pending">0</strong><span>Pending</span></div>
      <div class="stat"><strong id="stat-completed">0</strong><span>Completed</span></div>
      <div class="stat warn"><strong id="stat-overdue">0</strong><span>Overdue</span></div>
    </section>

    <!-- New task form -->
    <section class="panel">
      <h2>New task</h2>
      <form id="task-form" class="task-form">
        <input id="task-title" name="title" type="text" placeholder="Title" maxlength="200" required aria-label="Title">
        <input id="task-due" name="dueDate" type="date" aria-label="Due date">
        <textarea id="task-description" name="description" rows="2" maxlength="2000" placeholder="Description (optional)" aria-label="Description"></textarea>
        <button type="submit" class="btn primary">Add task</button>
      </form>
    </section>

    <!-- Task list with filters -->
    <section class="panel">
      <div class="list-header">
        <h2>My tasks</h2>
        <div class="filters" role="tablist">
          <button type="button" class="filter active" data-status="all">All</button>
          <button type="button" class="filter" data-status="pending">Pending</button>
          <button type="button" class="filter" data-status="completed">Completed</button>
        </div>
      </div>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty" class="muted empty" hidden>No tasks here yet.</p>
    </section>

    <p id="message" class="message" role="alert" hidden></p>
  </main>

  <!-- Template for one task in the list (cloned by app.js) -->
  <template id="task-template">
    <li class="task">
      <input type="checkbox" class="task-done" aria-label="Mark as completed">
      <div class="task-body">
        <div class="task-title"></div>
        <div class="task-meta"></div>
        <div class="task-description"></div>
        <ul class="attachments"></ul>
        <!-- Edit form, shown only while editing -->
        <form class="edit-form" hidden>
          <input name="title" type="text" maxlength="200" required aria-label="Title">
          <input name="dueDate" type="date" aria-label="Due date">
          <textarea name="description" rows="2" maxlength="2000" aria-label="Description"></textarea>
          <div class="row">
            <button type="submit" class="btn primary">Save</button>
            <button type="button" class="btn cancel-edit">Cancel</button>
          </div>
        </form>
      </div>
      <div class="task-actions">
        <label class="btn small">
          Attach
          <input type="file" class="file-input" hidden>
        </label>
        <button type="button" class="btn small edit">Edit</button>
        <button type="button" class="btn small danger delete">Delete</button>
      </div>
    </li>
  </template>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
